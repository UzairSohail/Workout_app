<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09090f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout" />
    <link rel="icon" href="./favicon-pink.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-pink.png" />
    <title>Workout</title>
    <script>
      // Open in the last theme straight away; src/theme.ts keeps this in step with Settings.
      try {
        var t = localStorage.getItem('theme');
        var bg = { ocean: '#060a13', forest: '#070c09', ember: '#0f0a07', daylight: '#f3f3f7', midnight: '#000000' }[t];
        if (bg) {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
          // Dark status-bar text on the light theme (iPhone reads this when the app opens).
          if (t === 'daylight') document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
